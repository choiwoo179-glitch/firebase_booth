<style>
:root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; height: 100%; background: #2b2540; font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
body { display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
#wrap { position: relative; width: min(100vw, calc(100vh * var(--ratio, 1.5385))); }

<script>
const FIREBASE_CONFIG = {

const CONFIG = {
  tile: 40, matchTime: 120, countdown: 3, fighterRadius: 18,
  zone: { start: 30, last: 10, dps: 300, dpsLast: 700, tick: 0.5, minW: 0.35, minH: 0.4 },
  map: null,
  maps: {
    "1v1": [
      "####################",
      "#..................#",
      "#...##........##...#",
      "#...#..........#...#",
      "#..................#",
      "#.....BB....BB.....#",
      "#.1...B..##..B...2.#",
      "#.....BB....BB.....#",
      "#..................#",
      "#...#..........#...#",
      "#...##........##...#",
      "#..................#",
      "####################",
    ],
    "2v2": [
      "########################",
      "#......................#",
      "#..##..............##..#",
      "#..#................#..#",
      "#.1......BB..BB......2.#",
      "#.....#..........#.....#",
      "#.....#..........#.....#",
      "#......B..####..B......#",
      "#.....#..........#.....#",
      "#.....#..........#.....#",
      "#.3......BB..BB......4.#",
      "#..#................#..#",
      "#..##..............##..#",
      "#......................#",
      "########################",
    ],
  },
};
let MAP_COLS = 0, MAP_ROWS = 0;

function tileAt(col, row) {
  if (col < 0 || row < 0 || col >= MAP_COLS || row >= MAP_ROWS) return "#";
  return CONFIG.map[row][col];
}
function isSolid(col, row) { const c = tileAt(col, row); return c === "#" || c === "B"; }
function circleHitsWall(x, y, r) {
  const t = CONFIG.tile;
  const c0 = Math.floor((x - r) / t), c1 = Math.floor((x + r) / t);
  const r0 = Math.floor((y - r) / t), r1 = Math.floor((y + r) / t);
  for (let row = r0; row <= r1; row++) {
    for (let col = c0; col <= c1; col++) {
      if (!isSolid(col, row)) continue;
      const nx = Math.max(col * t, Math.min(x, (col + 1) * t));
      const ny = Math.max(row * t, Math.min(y, (row + 1) * t));
      if ((x - nx) * (x - nx) + (y - ny) * (y - ny) < r * r) return true;
    }
  }
  return false;
}
function findStart(mark) {
  for (let row = 0; row < MAP_ROWS; row++) {
    const col = CONFIG.map[row].indexOf(mark);
    if (col >= 0) return { x: (col + 0.5) * CONFIG.tile, y: (row + 0.5) * CONFIG.tile };
  }
  return { x: CONFIG.tile * 2, y: CONFIG.tile * 2 };
}
function useMap(mode) { CONFIG.map = CONFIG.maps[mode]; MAP_COLS = CONFIG.map[0].length; MAP_ROWS = CONFIG.map.length; }
function pushOutOfWall(f) {
  if (!circleHitsWall(f.x, f.y, f.r)) return;
  for (let d = 4; d <= 80; d += 4) {
    for (let a = 0; a < 16; a++) {
      const x = f.x + Math.cos(a * Math.PI / 8) * d, y = f.y + Math.sin(a * Math.PI / 8) * d;
      if (!circleHitsWall(x, y, f.r)) { f.x = x; f.y = y; return; }
    }
  }
}

const Zone = {
  rect(timeLeft) {
    const z = CONFIG.zone;
    if (timeLeft > z.start) return null;
    const t = CONFIG.tile, L = t, T = t, R = (MAP_COLS - 1) * t, B = (MAP_ROWS - 1) * t;
    const cx = (L + R) / 2, cy = (T + B) / 2, p = 1 - Math.max(0, timeLeft) / z.start;
    const w = (R - L) * (1 - p * (1 - z.minW)), h = (B - T) * (1 - p * (1 - z.minH));
    return { l: cx - w / 2, r: cx + w / 2, t: cy - h / 2, b: cy + h / 2 };
  },
  inside(f, rect, margin = 0) {
    return f.x >= rect.l + margin && f.x <= rect.r - margin && f.y >= rect.t + margin && f.y <= rect.b - margin;
  },
  apply(game, dt) {
    const z = CONFIG.zone;
    if (game.zoneMsg < 1) { game.zoneMsg = 1; game.banner = { text: "안전 구역이 줄어들어요!", color: "#ff8fa3", t: 0 }; game.shake = Math.max(game.shake, 0.3); }
    if (game.zoneMsg < 2 && game.timeLeft <= z.last) {
      game.zoneMsg = 2; game.banner = { text: "마지막 10초! 구역 밖 피해 증가", color: "#ff4d6d", t: 0 };
      game.shake = Math.max(game.shake, 0.5); game.flash = { color: "#ff4d6d", a: 0.25 };
    }
    if ((game.zoneTick -= dt) > 0) return;
    game.zoneTick += z.tick;
    const dmg = (game.timeLeft <= z.last ? z.dpsLast : z.dps) * z.tick;
    for (const f of game.fighters) if (f.alive && !this.inside(f, game.zone)) f.takeDamage(dmg, game, null);
  },
};

const CHARACTERS = {
  chiikawa: { name: "치이카와", desc: "균형 잡힌 초보자용 캐릭터.", look: { color: "#fff6f8" }, hp: 4500, atk: 520, attackSpeed: 1.5, speed: 190, range: 280, attack: { type: "projectile", speed: 520, radius: 8 }, special: { color: "#ff8fb1", name: "짧은 돌진", desc: "이동(또는 조준) 방향으로 돌진", type: "dash", need: 1500, cooldown: 3, duration: 0.16, dashSpeed: 1000 } },
  hachiware: { name: "하치와레", desc: "빠른 연사로 중거리에서 때리는 캐릭터.", look: { color: "#eaf4ff" }, hp: 4200, atk: 310, attackSpeed: 2.4, speed: 185, range: 300, attack: { type: "projectile", speed: 600, radius: 6 }, special: { color: "#ffd54a", name: "신나는 연사", desc: "4초 동안 공속 1.7배", type: "buff", need: 2600, cooldown: 6, duration: 4, atkSpeedMul: 1.7 } },
  usagi: { name: "우사기", desc: "빠르게 움직이며 피하는 캐릭터.", look: { color: "#fff3a8" }, hp: 3900, atk: 260, attackSpeed: 3.0, speed: 250, range: 240, attack: { type: "projectile", speed: 560, radius: 6 }, special: { color: "#ff7ad9", name: "우라라라", desc: "2.5초 동안 공속 2배, 이동속도 1.2배", type: "buff", need: 2600, cooldown: 6, duration: 2.5, atkSpeedMul: 2, speedMul: 1.2 } },
  momonga: { name: "모몽가", desc: "넓은 폭발로 견제하는 캐릭터.", look: { color: "#fbf8f5" }, hp: 3600, atk: 570, attackSpeed: 1.2, speed: 180, range: 260, attack: { type: "projectile", speed: 380, radius: 10, explode: 75 }, special: { color: "#ff9a3c", name: "대폭발", desc: "주변 반경 130px에 1.6배 피해", type: "blast", need: 2800, cooldown: 6, radius: 130, dmgMul: 1.6 } },
  kurimanju: { name: "쿠리만쥬", desc: "느리지만 튼튼한 근접 캐릭터.", look: { color: "#e8b878" }, hp: 5400, atk: 760, attackSpeed: 0.9, speed: 150, range: 75, attack: { type: "cone", angle: 1.75 }, special: { color: "#8fc7ff", name: "단단한 몸", desc: "4초 동안 받는 피해 50% 감소", type: "buff", need: 2400, cooldown: 6, duration: 4, takeMul: 0.5 } },
  shisa: { name: "시사", desc: "관통하는 일격으로 뚫는 캐릭터.", look: { color: "#ffd9a0" }, hp: 4200, atk: 680, attackSpeed: 1.0, speed: 170, range: 340, attack: { type: "projectile", speed: 700, radius: 10, pierce: true }, special: { color: "#ffb347", name: "강화 일격", desc: "다음 공격: 피해 2.2배, 크기 1.8배", type: "empower", need: 2600, cooldown: 5, duration: 6, dmgMul: 2.2, sizeMul: 1.8, rangeMul: 1.3 } },
  rakko: { name: "라코", desc: "멀리서 정확히 맞히는 저격수.", look: { color: "#8a6446" }, hp: 3000, atk: 800, attackSpeed: 0.8, speed: 175, range: 420, attack: { type: "projectile", speed: 950, radius: 6 }, special: { color: "#6fd8ff", name: "정조준", desc: "다음 공격: 피해 2.5배, 탄속 1.5배", type: "empower", need: 2600, cooldown: 5, duration: 6, dmgMul: 2.5, speedMul: 1.5, rangeMul: 1.3 } },
  kani: { name: "카니", desc: "벽에 튕기는 탄으로 노리는 캐릭터.", look: { color: "#ff9a8a" }, hp: 3800, atk: 470, attackSpeed: 1.6, speed: 190, range: 380, attack: { type: "projectile", speed: 480, radius: 9, bounce: true }, special: { color: "#8affb5", name: "튕김 폭풍", desc: "4초 동안 탄 3갈래 분사", type: "buff", need: 2800, cooldown: 6, duration: 4, volley: 3, spread: 0.3, dmgMul: 0.6, rangeMul: 1.3 } },
};

function dps(c) { return c.atk * c.attackSpeed; }
function hitArea(c) {
  const a = c.attack, body = CONFIG.fighterRadius;
  if (a.type === "cone") return { width: Math.round(2 * (c.range + body) * Math.sin(a.angle / 2)), text: "부채꼴 " + Math.round(a.angle * 180 / Math.PI) + "도" };
  if (a.explode) return { width: 2 * (a.explode + body), text: "폭발 지름 " + 2 * (a.explode + body) + "px" };
  const w = 2 * (a.radius + body);
  return { width: w, text: (a.pierce ? "관통 " : a.bounce ? "튕김 " : "직선 ") + "폭 " + w + "px" };
}

const GRAPHICS = { folder: "assets/characters/", debug: false, default: { scale: 1.3, offsetX: 0, offsetY: 0, facing: "right", flip: true, smooth: true, procedural: true }, chars: { chiikawa:{}, hachiware:{}, usagi:{}, momonga:{}, kurimanju:{}, shisa:{}, rakko:{}, kani:{} } };
const GFX = {
  img: {}, cfg(id) { return { ...GRAPHICS.default, ...(GRAPHICS.chars[id] || {}) }; },
  load() {
    for (const id in CHARACTERS) {
      const set = (this.img[id] = {}), c = this.cfg(id);
      const add = (state, file, frames, fps) => {
        const im = new Image();
        im.onload = () => { if (typeof Select !== "undefined" && Select.redrawIcon) Select.redrawIcon(id); };
        im.src = GRAPHICS.folder + file; set[state] = { im, frames: Math.max(1, frames || 1), fps: fps || 8 };
      };
      add("base", id + ".png", 1, 1);
      for (const s in c.sheets || {}) add(s, c.sheets[s].file || id + "_" + s + ".png", c.sheets[s].frames, c.sheets[s].fps);
    }
  },
  ok(e) { return !!e && !!e.im && e.im.complete && e.im.naturalWidth > 0; },
  ready(id) { const s = this.img[id]; return !!s && Object.values(s).some((e) => this.ok(e)); },
  draw(ctx, id, x, y, r, pose, flash) {
    if (!this.ready(id)) return false;
    const c = this.cfg(id), s = this.img[id], p = pose || {};
    const dur = (e) => e.frames / e.fps;
    let e, frame = 0;
    if (this.ok(s.hurt) && p.hurtT < dur(s.hurt)) { e = s.hurt; frame = Math.min(e.frames - 1, Math.floor(p.hurtT * e.fps)); }
    else if (this.ok(s.attack) && p.atkT < dur(s.attack)) { e = s.attack; frame = Math.min(e.frames - 1, Math.floor(p.atkT * e.fps)); }
    else {
      e = p.moving && this.ok(s.walk) ? s.walk : this.ok(s.idle) ? s.idle : this.ok(s.base) ? s.base : Object.values(s).find((q) => this.ok(q));
      frame = e.frames > 1 ? Math.floor((p.t || 0) * e.fps) % e.frames : 0;
    }
    const ref = [s.base, s.idle, s.walk, s.attack, s.hurt].find((q) => this.ok(q));
    const fw = Math.floor(e.im.naturalWidth / e.frames), fh = e.im.naturalHeight;
    const rw = Math.floor(ref.im.naturalWidth / ref.frames), rh = ref.im.naturalHeight;
    const k = r * c.scale * (p.icon ? 0.85 : 1), sc = (k * 2) / Math.max(rw, rh);
    const w = fw * sc, h = fh * sc, u = r / 20.7;
    ctx.save();
    ctx.imageSmoothingEnabled = c.smooth !== false;
    if (c.smooth !== false) ctx.imageSmoothingQuality = "high";
    const faceLeft = c.facing === "left", wantLeft = (p.aimX || 0) < 0;
    if (c.flip !== false && wantLeft !== faceLeft) { ctx.translate(x, 0); ctx.scale(-1, 1); ctx.translate(-x, 0); }
    if (flash) ctx.filter = "brightness(1.6)";
    ctx.drawImage(e.im, frame * fw, 0, fw, fh, x - w / 2 + c.offsetX * u, y + k * 0.95 - h + c.offsetY * u, w, h);
    ctx.restore();
    return true;
  },
};
GFX.load();

const Input = {
  keys: {}, mouseX: 0, mouseY: 0, mouseDown: false, touches: {}, tapUntil: 0, specialQueued: false, p2SpecialQueued: false, sticks: null,
  reset() { this.mouseDown = false; this.touches = {}; this.tapUntil = 0; this.specialQueued = false; this.p2SpecialQueued = false; this.drawSticks(); },
  init(canvas) {
    if ("ontouchstart" in window || (typeof navigator !== "undefined" && navigator.maxTouchPoints > 0)) {
      this.sticks = {};

class Projectile {
  constructor(owner, m, off) {
    const s = owner.data.attack, ang = Math.atan2(owner.aimY, owner.aimX) + off, dx = Math.cos(ang), dy = Math.sin(ang);
    this.owner = owner; this.team = owner.team;

  }
  step(dt, game) {
    const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;

      if (!this.bounce) return this.finish(game);
      const hx = circleHitsWall(nx, this.y, this.r), hy = circleHitsWall(this.x, ny, this.r);
      if (hx) this.vx = -this.vx;
      if (hy) this.vy = -this.vy;
      if (!hx && !hy) { this.vx = -this.vx; this.vy = -this.vy; }
    } else { this.x = nx; this.y = ny; }
    this.left -= Math.hypot(this.vx, this.vy) * dt;
    if (this.glow && Math.random() < 0.5) FX.burst(game, this.x, this.y, this.glow, 1, 30, 0.35, 3.5);
    if (this.left <= 0) return this.finish(game);
    for (const f of game.fighters) {
      if (!f.alive || f.team === this.team || this.hit.has(f)) continue;
      if (Math.hypot(f.x - this.x, f.y - this.y) >= f.r + this.r) continue;
      if (this.explode) return this.finish(game);
      f.takeDamage(this.damage, game, this.owner);
      this.hit.add(f);

const ATTACKS = {
  projectile(owner, game, m) {
    for (let i = 0; i < m.count; i++) game.projectiles.push(new Projectile(owner, m, (i - (m.count - 1) / 2) * m.spread));
  },
  cone(owner, game, m) {
    const s = owner.data.attack, base = Math.atan2(owner.aimY, owner.aimX), reach = owner.data.range * m.range;
    for (const f of game.fighters) {
      if (!f.alive || f.team === owner.team) continue;
      const dx = f.x - owner.x, dy = f.y - owner.y;
      if (Math.hypot(dx, dy) > reach + f.r) continue;
      let d = Math.atan2(dy, dx) - base;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      if (Math.abs(d) <= s.angle / 2 && hasLineOfSight(owner, f)) f.takeDamage(owner.data.atk * m.dmg, game, owner);
    }
    game.effects.push({ kind: "cone", x: owner.x, y: owner.y, dir: base, range: reach, angle: s.angle, team: owner.team, t: 0 });
  },

const SPECIALS = {
  dash(f, game, cmd) {
    let dx = cmd.mx, dy = cmd.my;
    const l = Math.hypot(dx, dy);
    if (l < 0.2) { dx = f.aimX; dy = f.aimY; } else { dx /= l; dy /= l; }
    f.dash = { t: f.sp.duration, dx, dy };
  },
  buff(f) { f.buff = { ...f.sp, t: f.sp.duration }; },
  empower(f) { f.empower = { ...f.sp, t: f.sp.duration }; },
  blast(f, game) {
    const s = f.sp;
    for (const o of game.fighters) {
      if (o.alive && o.team !== f.team && Math.hypot(o.x - f.x, o.y - f.y) < s.radius + o.r && hasLineOfSight(f, o)) o.takeDamage(f.data.atk * s.dmgMul, game, f);
    }
    game.effects.push({ kind: "circle", x: f.x, y: f.y, r: s.radius, team: f.team, t: 0 });
  },

function useSpecial(f, game, cmd) {
  SPECIALS[f.sp.type](f, game, cmd);
  FX.special(f, game);
  f.charge = 0; f.cdLeft = f.sp.cooldown;
}

const FX = {
  burst(game, x, y, color, n, speed, life, size, dir, spread) {
    for (let i = 0; i < n && game.particles.length < 400; i++) {
      const a = dir === undefined ? Math.random() * Math.PI * 2 : dir + (Math.random() - 0.5) * spread, s = speed * (0.4 + Math.random() * 0.6);
      game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.4), t: 0, size, color });
    }
  },
  ring(game, x, y, r, color, dur, delay = 0) { game.effects.push({ kind: "ring", x, y, r, color, dur, t: -delay }); },
  special(f, game) {
    const c = f.sp.color, blast = f.sp.type === "blast";

    game.shake = Math.max(game.shake, blast ? 0.9 : 0.35);
    game.flash = { color: c, a: blast ? 0.45 : 0.2 };
    this.burst(game, f.x, f.y, c, 30, 260, 0.7, 5);
    this.ring(game, f.x, f.y, 70, c, 0.4);

      this.ring(game, f.x, f.y, f.sp.radius * 1.15, "#fff", 0.7, 0.1);

      game.effects.push({ kind: "circle", color: c, x: f.x, y: f.y, r: f.sp.radius, dur: 0.3, t: 0 });
    }
  },
  tick(game, dt) {

    if (game.flash && (game.flash.a -= dt * 0.6) <= 0) game.flash = null;
    if (game.banner && (game.banner.t += dt) > 1.2) game.banner = null;
    for (const f of game.fighters) {
      const c = f.alive && f.auraColor();
      if (!c) continue;
      if (f.dash) { game.particles.push({ x: f.x, y: f.y, vx: 0, vy: 0, life: 0.3, t: 0, ghost: f.charId, size: f.r * 1.15, color: c }); continue; }

class Fighter {
  constructor(charId, team, x, y, isBot, isLocalP2 = false) {
    this.charId = charId; this.data = CHARACTERS[charId];
    this.team = team; this.isBot = isBot; this.isLocalP2 = isLocalP2;
    this.x = x; this.y = y; this.r = CONFIG.fighterRadius;
    this.hp = this.data.hp; this.maxHp = this.data.hp;
    this.alive = true; this.deadT = 0;
    this.cooldown = 0; this.hitFlash = 0;
    this.aimX = team === 0 ? 1 : -1; this.aimY = 0;
    this.animT = 0; this.atkT = 9; this.hurtT = 9; this.moving = false; this.phase = Math.random() * 3;
    this.charge = 0; this.cdLeft = 0;
    this.buff = null; this.empower = null; this.dash = null;
  }
  get sp() { return this.data.special; }

  auraColor() { return this.buff || this.empower || this.dash ? this.sp.color : null; }

    this.cooldown = Math.max(0, this.cooldown - dt);
    this.hitFlash = Math.max(0, this.hitFlash - dt);
    this.cdLeft = Math.max(0, this.cdLeft - dt);
    if (this.buff && (this.buff.t -= dt) <= 0) this.buff = null;
    if (this.empower && (this.empower.t -= dt) <= 0) this.empower = null;
    const al = Math.hypot(cmd.ax, cmd.ay);
    if (al > 0.1) { this.aimX = cmd.ax / al; this.aimY = cmd.ay / al; }
    if (cmd.special && this.specialReady) useSpecial(this, game, cmd);
    if (this.dash) {
      const d = this.dash, step = Math.min(dt, d.t);
      this.slide(d.dx * this.sp.dashSpeed * step, d.dy * this.sp.dashSpeed * step);
      if ((d.t -= dt) <= 0) this.dash = null;

  attack(game) {

    if (e.t) {
      FX.burst(game, this.x + this.aimX * this.r * 1.5, this.y + this.aimY * this.r * 1.5, e.color, 16, 320, 0.4, 4, Math.atan2(this.aimY, this.aimX), 0.9);

function hasLineOfSight(a, b) {

    if (circleHitsWall(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 6)) return false;
  }
  return true;
}

const BotAI = {
  think(bot, enemy, game) {
    if (!enemy) return { mx: 0, my: 0, ax: 0, ay: 0, fire: false, special: false };
    const dx = enemy.x - bot.x, dy = enemy.y - bot.y, dist = Math.hypot(dx, dy) || 1;
    const nx = dx / dist, ny = dy / dist;
    const sight = hasLineOfSight(bot, enemy), range = bot.data.range;
    let mx = 0, my = 0;
    if (!bot.chk || game.time - bot.chk.t >= 0.6) {
      if (bot.chk && !sight && Math.hypot(bot.x - bot.chk.x, bot.y - bot.chk.y) < 12) bot.wander = { until: game.time + 1.0, a: Math.random() * Math.PI * 2 };
      bot.chk = { t: game.time, x: bot.x, y: bot.y };
    }
    if (!sight || dist > range * 0.8) { mx = nx; my = ny; }
    else if (dist < range * 0.4) { mx = -nx; my = -ny; }
    if (bot.wander && game.time < bot.wander.until) { mx = Math.cos(bot.wander.a); my = Math.sin(bot.wander.a); }
    const side = Math.sin(game.time * 1.3 + bot.team * 2) >= 0 ? 1 : -1;
    mx += -ny * side * 0.6; my += nx * side * 0.6;
    if (game.zone && !Zone.inside(bot, game.zone, 30)) {
      const cx = (game.zone.l + game.zone.r) / 2, cy = (game.zone.t + game.zone.b) / 2, d = Math.hypot(cx - bot.x, cy - bot.y) || 1;
      mx = (cx - bot.x) / d; my = (cy - bot.y) / d;
    }
    const err = (Math.random() - 0.5) * 0.25;
    const c = Math.cos(err), s = Math.sin(err);
    const sp = bot.sp;
    let special = false;
    if (bot.specialReady && sight) special = sp.type === "dash" ? dist > range * 0.5 : sp.type === "blast" ? dist < sp.radius : dist < range;
    return { mx, my, ax: nx * c - ny * s, ay: nx * s + ny * c, fire: sight && dist < range, special };
  },
};

const TEAM_COLORS = ["#4aa3ff", "#ff5a6e"];

function render(ctx, game) {
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.save();
  if (game.shake > 0) ctx.translate((Math.random() - 0.5) * game.shake * 22, (Math.random() - 0.5) * game.shake * 22);
  drawMap(ctx);
  drawZone(ctx, game);
  for (const f of game.fighters) if (f.alive || f.deadT < 0.5) drawFighter(ctx, f, (f === game.player || f.isLocalP2) && game.state === "playing");
  for (const p of game.projectiles) drawProjectile(ctx, p);
  drawEffects(ctx, game);
  drawParticles(ctx, game);
  drawPopups(ctx, game);
  ctx.restore();
  drawHUD(ctx, game);
  drawBanner(ctx, game);
}

function drawMap(ctx) {
  const t = CONFIG.tile;
  for (let row = 0; row < MAP_ROWS; row++) {
    for (let col = 0; col < MAP_COLS; col++) {
      const x = col * t, y = row * t, c = tileAt(col, row);
      ctx.fillStyle = (col + row) % 2 ? "#d4efc9" : "#c9e8bd";
      ctx.fillRect(x, y, t, t);
      if (c === "#") {
        ctx.fillStyle = "#8e7bb5"; ctx.fillRect(x, y, t, t);
        ctx.fillStyle = "#a794cf"; ctx.fillRect(x, y, t, t - 6);
      } else if (c === "B") {
        ctx.fillStyle = "#c99a63"; ctx.fillRect(x + 3, y + 3, t - 6, t - 6);
        ctx.strokeStyle = "#8d6335"; ctx.lineWidth = 2; ctx.strokeRect(x + 3, y + 3, t - 6, t - 6);
        ctx.beginPath(); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + t - 3, y + t - 3);
        ctx.moveTo(x + t - 3, y + 3); ctx.lineTo(x + 3, y + t - 3); ctx.stroke();
      }
    }
  }
}

function drawFighter(ctx, f, showAim) {
  const r = f.r, TAU = Math.PI * 2;

    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x + f.aimX * f.data.range, f.y + f.aimY * f.data.range); ctx.stroke();

  const pr = img && GFX.cfg(f.charId).procedural === false ? 0 : 1;
  const bob = pr * Math.sin(t * (mv ? 16 : 4)) * (mv ? 2.2 : 1), k = pr * Math.max(0, 1 - f.atkT / 0.15), wob = pr && mv ? Math.sin(t * 16) * 0.04 : 0;
  const sx = img ? 1 + 0.08 * k : 1 + 0.12 * k + wob, sy = img ? sx : 1 - 0.1 * k - wob;
  ctx.save(); ctx.translate(f.x + f.aimX * 5 * k, f.y + r + bob + f.aimY * 5 * k); ctx.rotate(pr && mv ? Math.sin(t * 16) * 0.07 : 0); ctx.scale(sx, sy); ctx.translate(-f.x, -(f.y + r));
  drawBody(ctx, f.charId, f.x, f.y, r * 1.15, f.hitFlash > 0, { lookX: f.aimX, lookY: f.aimY, blink: t % 3.4 < 0.12, hurt: f.hitFlash > 0, aimX: f.aimX, moving: mv, t, atkT: f.atkT, hurtT: f.hurtT });

    ctx.fillStyle = p.specialReady ? "#ffd54a" : "#c9a63a"; ctx.fillRect(10, 54, 170 * p.charge / p.sp.need, 14);
    ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "left";

function drawEffects(ctx, game) {
  for (const e of game.effects) {
    if (e.t < 0) continue;
    const k = e.t / (e.dur || 0.18), col = e.color || TEAM_COLORS[e.team];
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.beginPath();
    if (e.kind === "ring") { ctx.globalAlpha = Math.max(0, 1 - k); ctx.lineWidth = 8 * (1 - k) + 2; ctx.arc(e.x, e.y, e.r * (0.3 + 0.7 * k), 0, Math.PI * 2); ctx.stroke(); continue; }

  ctx.fillStyle = "rgba(20,10,40,.45)"; ctx.fillRect(-W / 2, -36, W, 52);
  ctx.font = "900 34px sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 8; ctx.lineJoin = "round"; ctx.strokeStyle = "#3b2a5a";

const PI2 = Math.PI * 2, OUTLINE = "#6b5560";

}
function dot(ctx, x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, PI2); ctx.fill(); }

const SPRITES = {

  usagi: { back: (c, x, y, r, col) => { for (const s of [-1, 1]) { blob(c, x + s * r * 0.42, y - r * 1.2, r * 0.24, r * 0.66, col, s * 0.12); blob(c, x + s * r * 0.42, y - r * 1.2, r * 0.11, r * 0.45, "#ffb3c6", s * 0.12); } }, face: { er: 0.16, mouth: "open" } },
  momonga: { back: (c, x, y, r, col) => { blob(c, x + r * 0.95, y + r * 0.75, r * 0.3, r * 0.58, "#8fd0f5", 0.6); blob(c, x + r * 1.12, y + r * 1.05, r * 0.16, r * 0.2, "#d6efff", 0.6); for (const s of [-1, 1]) { blob(c, x + s * r * 1.0, y + r * 0.15, r * 0.38, r * 0.6, "#e9e4df", s * 0.25); blob(c, x + s * r * 1.12, y + r * 0.2, r * 0.14, r * 0.45, "#f2b8c6", s * 0.25); blob(c, x + s * r * 0.6, y - r * 0.88, r * 0.26, r * 0.26, col); } }, front: (c, x, y, r) => { c.fillStyle = "#f1ece6"; c.beginPath(); c.ellipse(x, y + r * 0.55, r * 0.62, r * 0.4, 0, 0, PI2); c.fill(); for (const s of [-1, 1]) blob(c, x + s * r * 0.4, y - r * 0.05, r * 0.25, r * 0.28, "#b7a89d"); c.strokeStyle = "#b7a89d"; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y - r * 0.95); c.lineTo(x, y - r * 0.55); c.stroke(); dot(c, x, y + r * 0.2, r * 0.07, "#5a4238"); }, face: { er: 0.17 } },
  kurimanju: { back: (c, x, y, r) => blob(c, x, y - r * 1.0, r * 0.2, r * 0.17, "#a8652c"), front: (c, x, y, r) => cap(c, x, y, r, "#c07a3a", 1.08, 1.92, 0) },
  shisa: { back: (c, x, y, r) => { for (let i = 0; i < 9; i++) { const a = i / 9 * PI2; blob(c, x + Math.cos(a) * r * 0.95, y + Math.sin(a) * r * 0.95, r * 0.3, r * 0.3, "#e58a3c"); } for (const s of [-1, 1]) blob(c, x + s * r * 0.82, y - r * 0.5, r * 0.26, r * 0.4, "#f2a04a", s * 0.5); }, front: (c, x, y, r) => dot(c, x, y + r * 0.14, r * 0.1, "#d94f4f") },

function drawBody(ctx, id, x, y, r, flash, pose) {
  if (GFX.draw(ctx, id, x, y, r, pose, flash)) return;
  const sp = SPRITES[id] || SPRITES.chiikawa, col = flash ? "#ffc9c9" : CHARACTERS[id].look.color;
  for (const s of [-1, 1]) {
    blob(ctx, x + s * r * 0.4, y + r * 0.95, r * 0.22, r * 0.14, col);
    blob(ctx, x + s * r * 1.0, y + r * 0.3, r * 0.17, r * 0.17, col);
  }
  if (sp.back) sp.back(ctx, x, y, r, col);

  ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(x - r * 0.4, y - r * 0.55, r * 0.22, r * 0.12, -0.6, 0, PI2); ctx.fill();

const Net = {
  pc: null, ch: null, role: null, connected: false, roomCode: null, guestChar: "chiikawa", roomRef: null,
  last: { mx: 0, my: 0, ax: 1, ay: 0, fire: false }, latch: false,
  lastRx: 0, handlers: {}, onOpen: null, onClose: null,

  _make() {
    const pc = (this.pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }));
    pc.onconnectionstatechange = () => { if (pc.connectionState === "failed" || pc.connectionState === "closed") this._lost(); };
    return pc;
  },
  _bind(ch) {
    this.ch = ch;
    ch.onopen = () => { this.connected = true; this.lastRx = performance.now(); if (this.onOpen) this.onOpen(); };
    ch.onclose = () => this._lost();
    ch.onmessage = (e) => { this.lastRx = performance.now(); const m = JSON.parse(e.data); if (this.handlers[m.t]) this.handlers[m.t](m); };
  },
  _lost() { if (this.connected) { this.connected = false; if (this.onClose) this.onClose(); } },
  _ice() {
    return new Promise((res) => {
      const pc = this.pc;
      if (pc.iceGatheringState === "complete") return res();
      pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === "complete") res(); };
      setTimeout(res, 3500);
    });
  },

  async host() {
    if (!db) throw new Error("FIREBASE_NOT_SET");
    this.role = "host";
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    this.roomCode = code;
    this.roomRef = db.ref("rooms/" + code);
    await this.roomRef.remove();

    const pc = this._make();
    this._bind(pc.createDataChannel("game"));
    await pc.setLocalDescription(await pc.createOffer());
    await this._ice();

    await this.roomRef.set({ offer: JSON.stringify(pc.localDescription) });
    this.roomRef.on("value", async (snap) => {
      const data = snap.val();
      if (data && data.answer && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.answer)));
      }
    });
    return code;
  },

  async join(code) {
    if (!db) throw new Error("FIREBASE_NOT_SET");
    this.role = "guest";
    this.roomCode = code;
    this.roomRef = db.ref("rooms/" + code);

    const snap = await this.roomRef.once("value");
    const data = snap.val();
    if (!data || !data.offer) throw new Error("ROOM_NOT_FOUND");

    const pc = this._make();
    pc.ondatachannel = (e) => this._bind(e.channel);
    await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.offer)));
    await pc.setLocalDescription(await pc.createAnswer());
    await this._ice();

    await this.roomRef.update({ answer: JSON.stringify(pc.localDescription) });
  },

  takeCmd() { const c = { ...this.last, special: this.latch }; this.latch = false; return c; },
  send(o) { if (this.ch && this.ch.readyState === "open") this.ch.send(JSON.stringify(o)); },
  close() {
    this.connected = false;
    if (this.roomRef) { this.roomRef.off(); this.roomRef.remove(); }
    if (this.pc) this.pc.close();
    this.pc = this.ch = this.role = this.roomRef = null;
  },
};

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const spBtn = document.getElementById("spBtn");
Input.init(canvas);

const game = {
  state: "menu", time: 0, timeLeft: 0, countdown: 0, endDelay: 0, result: null,
  fighters: [], projectiles: [], popups: [], effects: [], zone: null, zoneTick: 0, zoneMsg: 0, frame: 0, particles: [], shake: 0, flash: null, banner: null, player: null,
  cfg: { mode: "1v1", me: "chiikawa", mate: "random", foe: "random", foe2: "random", allowSame: true, localMulti: false }
};

function applyMap(mode) {
  useMap(mode);
  canvas.width = MAP_COLS * CONFIG.tile;
  canvas.height = MAP_ROWS * CONFIG.tile;
  document.documentElement.style.setProperty("--ratio", MAP_COLS / MAP_ROWS);
}
function choose(v, avoid) {
  const pool = Object.keys(CHARACTERS).filter((i) => !avoid.includes(i));
  return v !== "random" && pool.includes(v) ? v : pool[Math.floor(Math.random() * pool.length)];
}

function startMatch(cfg = game.cfg) {
  if (Net.role === "guest") return;
  game.cfg = cfg;
  applyMap(cfg.mode);
  const mk = (id, team, mark, bot, isP2 = false) => { const p = findStart(mark); return new Fighter(id, team, p.x, p.y, bot, isP2); };
  const avoid = (id) => (cfg.allowSame ? [] : [id]);
  
  game.fighters = [mk(cfg.me, 0, "1", false)];
  
  if (cfg.localMulti) {
    const foeChar = choose(cfg.foe, []);
    game.fighters.push(mk(foeChar, 1, "2", false, true));
  } else if (cfg.mode === "2v2") {
    const f1 = choose(cfg.foe, []);
    game.fighters.push(mk(choose(cfg.mate, avoid(cfg.me)), 0, "3", true), mk(f1, 1, "2", true), mk(choose(cfg.foe2, avoid(f1)), 1, "4", true));
  } else {
    game.fighters.push(mk(choose(cfg.foe, []), 1, "2", true));
  }
  
  game.player = game.fighters[0];
  if (Net.role === "host" && Net.connected) hostStart(cfg);
  game.projectiles = []; game.popups = []; game.effects = []; game.particles = []; game.shake = 0; game.flash = null; game.banner = null;
  game.time = 0; game.timeLeft = CONFIG.matchTime; game.countdown = CONFIG.countdown; game.endDelay = 0; game.result = null;
  game.zone = null; game.zoneTick = 0; game.zoneMsg = 0;
  game.state = "countdown";
  Input.reset();
  document.getElementById("overlay").classList.add("hidden");
  document.getElementById("select").classList.add("hidden");
}

function nearestEnemy(f) {
  let best = null, bd = Infinity;
  for (const o of game.fighters) {
    if (!o.alive || o.team === f.team) continue;
    const d = Math.hypot(o.x - f.x, o.y - f.y);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

function separateFighters() {
  const fs = game.fighters.filter((f) => f.alive);
  for (let i = 0; i < fs.length; i++) for (let j = i + 1; j < fs.length; j++) {
    const a = fs[i], b = fs[j], d = Math.hypot(b.x - a.x, b.y - a.y), min = a.r + b.r;
    if (d >= min || d === 0) continue;
    const px = (b.x - a.x) / d * (min - d) / 2, py = (b.y - a.y) / d * (min - d) / 2;
    for (const [f, sx, sy] of [[a, -px, -py], [b, px, py]]) {
      if (!circleHitsWall(f.x + sx, f.y, f.r)) f.x += sx;
      if (!circleHitsWall(f.x, f.y + sy, f.r)) f.y += sy;
    }
  }
}

function checkEnd() {
  const teams = new Set(game.fighters.filter((f) => f.alive).map((f) => f.team));
  let winner = null, why = "";
  if (teams.size === 0) { winner = -1; why = "동시에 쓰러졌어요"; }
  else if (teams.size === 1) { winner = [...teams][0]; why = "상대 팀을 모두 처치했어요"; }
  else if (game.timeLeft <= 0) {
    const hp = [0, 0];
    for (const f of game.fighters) hp[f.team] += f.hp;
    winner = hp[0] > hp[1] ? 0 : hp[1] > hp[0] ? 1 : -1;
    why = winner === -1 ? "시간 종료, 팀 체력이 같아요" : "시간 종료, 팀 남은 체력으로 판정";
  }
  if (winner === null) return;
  game.result = { winner, why };
  game.state = "ending"; game.endDelay = 0.8;
}

function showResult() {
  game.state = "ended";
  const w = game.result.winner, me = game.player ? game.player.team : 0, guest = Net.role === "guest";
  document.getElementById("result").textContent = game.result.title || (w === me ? "1P 승리!" : w === -1 ? "무승부" : (game.cfg.localMulti ? "2P 승리!" : "패배..."));
  document.getElementById("resultSub").textContent = game.result.why;
  document.getElementById("restart").classList.toggle("hidden", guest);
  document.getElementById("overlay").classList.remove("hidden");
}

function updateSpecialButton() {
  const p = game.player, show = game.state === "playing" && p && p.specialReady;
  spBtn.classList.toggle("hidden", !show);
  if (show) spBtn.textContent = p.sp.name;
}

function update(dt) {
  if (Net.role === "guest") { clientUpdate(dt); return; }
  game.time += dt;
  if (game.state === "countdown") {
    game.countdown -= dt;
    if (game.countdown <= 0) game.state = "playing";
  } else if (game.state === "playing") {
    game.timeLeft = Math.max(0, game.timeLeft - dt);
    for (const f of game.fighters) {
      if (!f.alive) continue;
      const en = nearestEnemy(f);
      let cmd;
      if (f.remote) cmd = Net.takeCmd();
      else if (f.isLocalP2) cmd = Input.readP2(f, en);
      else if (f.isBot) cmd = BotAI.think(f, en, game);
      else cmd = Input.read(f, en);

      f.update(dt, cmd, game);
      pushOutOfWall(f);
    }
    separateFighters();
    game.zone = Zone.rect(game.timeLeft);
    if (game.zone) Zone.apply(game, dt);
    for (const p of game.projectiles) p.update(dt, game);
    game.projectiles = game.projectiles.filter((p) => !p.dead);
    checkEnd();
  } else if (game.state === "ending") {
    if ((game.endDelay -= dt) <= 0) showResult();
  }
  FX.tick(game, dt);
  for (const e of game.effects) e.t += dt;
  game.effects = game.effects.filter((e) => e.t < (e.dur || 0.18));
  for (const p of game.popups) p.t += dt;
  game.popups = game.popups.filter((p) => p.t < 0.8);
  for (const f of game.fighters) { f.hitFlash = Math.max(0, f.hitFlash - dt); if (!f.alive) f.deadT += dt; }
  updateSpecialButton();
  if (Net.role === "host" && Net.connected) {
    if (game.state !== "menu" && ++game.frame % 3 === 0) Net.send(snapshot());
    else if (game.state === "menu" && ++game.frame % 60 === 0) Net.send({ t: "ping" });
    if (game.state === "playing" && performance.now() - Net.lastRx > 4000) Net._lost();
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now; update(dt); render(ctx, game); requestAnimationFrame(loop);
}

spBtn.onpointerdown = (e) => { e.preventDefault(); Input.specialQueued = true; };
document.getElementById("restart").onclick = () => startMatch();
document.getElementById("menu").onclick = () => {
  if (Net.role === "guest") Net.close();
  else if (Net.role === "host" && Net.connected) Net.send({ t: "menu" });
  game.state = "menu"; document.getElementById("overlay").classList.add("hidden"); Select.show();
};
window.addEventListener("keydown", (e) => { if (e.code === "Enter" && game.state === "ended") startMatch(); });
applyMap("1v1");
Select.init(startMatch);
requestAnimationFrame(loop);

function hostStart(cfg) {
  const old = game.fighters[1], p = findStart(cfg.mode === "2v2" ? "3" : "2");
  const g = new Fighter(Net.guestChar, old.team, p.x, p.y, false);
  g.remote = true; game.fighters[1] = g;
  Net.send({ t: "start", mode: cfg.mode, f: game.fighters.map((f) => ({ id: f.charId, team: f.team, x: f.x, y: f.y })) });
}
function snapshot() {
  const q = (v) => Math.round(v * 100) / 100;
  return { t: "s", st: game.state, tl: q(game.timeLeft), cd: q(game.countdown), res: game.result,
    f: game.fighters.map((f) => [Math.round(f.x), Math.round(f.y), Math.round(f.hp), +f.alive, q(f.aimX), q(f.aimY), Math.round(f.charge), q(f.cdLeft), q(f.hitFlash), +!!f.buff, +!!f.empower, +!!f.dash, +f.moving, q(f.atkT)]),
    p: game.projectiles.map((p) => [Math.round(p.x), Math.round(p.y), p.r, p.team, p.glow || 0]),
    e: game.effects, po: game.popups, bn: game.banner, sh: q(game.shake), fl: game.flash };
}
Net.handlers.hi = (m) => {
  Net.guestChar = CHARACTERS[m.char] ? m.char : "chiikawa";
  panel("친구 연결됨!", "친구 캐릭터: " + CHARACTERS[Net.guestChar].name + ". 닫기를 누르고 모드와 캐릭터를 고른 뒤 '전투 시작'을 누르세요.", []);
};
Net.handlers.in = (m) => { Net.last = { mx: m.mx, my: m.my, ax: m.ax, ay: m.ay, fire: m.fire }; if (m.special) Net.latch = true; };
Net.handlers.start = (m) => {
  applyMap(m.mode);
  game.fighters = m.f.map((o) => { const f = new Fighter(o.id, o.team, o.x, o.y, false); f.tx = o.x; f.ty = o.y; return f; });
  game.player = game.fighters[1];
  game.projectiles = []; game.popups = []; game.effects = []; game.particles = []; game.banner = null; game.flash = null; game.shake = 0; game.result = null;
  game.state = "countdown"; game.cfg.mode = m.mode;
  Input.reset();
  for (const id of ["overlay", "select", "online"]) document.getElementById(id).classList.add("hidden");
};
Net.handlers.menu = () => { game.state = "menu"; document.getElementById("overlay").classList.add("hidden"); panel("대기 중", "방장이 다시 시작하길 기다리고 있어요.", []); };
Net.handlers.s = (m) => {
  if (!game.fighters.length || Net.role !== "guest") return;
  m.f.forEach((a, i) => {
    const f = game.fighters[i]; if (!f) return;
    if (a[8] > f.hitFlash + 0.05) f.hurtT = 0;
    f.tx = a[0]; f.ty = a[1]; f.hp = a[2]; f.alive = !!a[3]; f.aimX = a[4]; f.aimY = a[5]; f.charge = a[6]; f.cdLeft = a[7]; f.hitFlash = a[8];
    f.buff = a[9] ? { takeMul: f.sp.takeMul } : null; f.empower = a[10] ? {} : null; f.dash = a[11] ? {} : null; f.moving = !!a[12]; f.atkT = a[13];
  });
  game.projectiles = m.p.map((a) => ({ x: a[0], y: a[1], r: a[2], team: a[3], glow: a[4] || null }));
  game.effects = m.e; game.popups = m.po; game.banner = m.bn; game.shake = m.sh; game.flash = m.fl;
  game.timeLeft = m.tl; game.countdown = m.cd;
  if (m.st !== game.state) { game.state = m.st; if (m.st === "ended") { game.result = m.res; showResult(); } }
};

function clientUpdate(dt) {
  game.time += dt;
  game.zone = game.state === "playing" || game.state === "ending" ? Zone.rect(game.timeLeft) : null;
  for (const f of game.fighters) {
    if (f.tx !== undefined) { f.x += (f.tx - f.x) * Math.min(1, dt * 14); f.y += (f.ty - f.y) * Math.min(1, dt * 14); if (Math.abs(f.tx - f.x) > 150) { f.x = f.tx; f.y = f.ty; } }
    f.animT += dt; f.atkT += dt; f.hurtT += dt; f.hitFlash = Math.max(0, f.hitFlash - dt);
    if (!f.alive) f.deadT += dt;
  }
  for (const e of game.effects) e.t += dt;
  for (const p of game.popups) p.t += dt;
  FX.tick(game, dt);
  if (game.state !== "menu" && game.player) Net.send({ t: "in", ...Input.read(game.player, nearestEnemy(game.player)) });
  if (Net.connected && performance.now() - Net.lastRx > 4000) Net._lost();
  updateSpecialButton();
}

function panel(title, msg, show) {
  const byId = (id) => document.getElementById(id);
  byId("online").classList.remove("hidden");
  byId("onTitle").textContent = title; byId("onMsg").textContent = msg;
  for (const id of ["codeDisplay", "codeIn", "goIn"]) byId(id).classList.toggle("hidden", !show.includes(id));
}

document.getElementById("mkRoom").onclick = async () => {
  Net.close();
  panel("방 만들기", "4자리 방 코드를 생성하는 중입니다...", []);
  try {
    const code = await Net.host();
    document.getElementById("codeDisplay").textContent = code;
    panel("방 만들기", "상대방에게 아래 4자리 숫자를 전달하세요.", ["codeDisplay"]);
  } catch (e) {
    if (e.message === "FIREBASE_NOT_SET") {
      panel("Firebase 설정 필요", "온라인 4자리 방 기능을 사용하려면 HTML 파일 내부의 FIREBASE_CONFIG 변수 값을 채워주셔야 합니다.", []);
    } else {
      panel("오류 발생", "방 생성 중 오류가 발생했습니다: " + e.message, []);
    }
  }
};

document.getElementById("joinRoom").onclick = () => {
  Net.close();
  document.getElementById("codeIn").value = "";
  panel("방 참가", "방장이 알려준 4자리 숫자를 입력하세요.", ["codeIn", "goIn"]);
  document.getElementById("goIn").onclick = async () => {
    const code = document.getElementById("codeIn").value.trim();
    if (code.length !== 4) return alert("4자리 숫자를 정확히 입력하세요.");
    panel("방 참가", "방 연결 중...", []);
    try {
      await Net.join(code);
    } catch (e) {
      if (e.message === "FIREBASE_NOT_SET") {
        panel("Firebase 설정 필요", "온라인 4자리 방 기능을 사용하려면 HTML 파일 내부의 FIREBASE_CONFIG 변수 값을 채워주셔야 합니다.", []);
      } else {
        panel("입장 실패", "방을 찾을 수 없거나 연결에 실패했습니다.", []);
      }
    }
  };
};

document.getElementById("onClose").onclick = () => document.getElementById("online").classList.add("hidden");

Net.onOpen = () => {
  if (Net.role === "guest") { Net.send({ t: "hi", char: Select.picked }); panel("연결 성공!", "방장이 게임을 시작하길 기다리고 있습니다.", []); }
  else panel("연결 성공!", "상대방이 접속했습니다! 닫기를 누르고 '전투 시작'을 누르세요.", []);
};
Net.onClose = () => {
  if (Net.role === "host") {
    const f = game.fighters.find((x) => x.remote);
    if (f) { f.remote = false; f.isBot = true; game.banner = { text: "친구 연결이 끊겨 AI가 대신해요", color: "#ffffff", t: 0 }; }
  } else if (Net.role === "guest") {
    game.result = { winner: -1, title: "연결 끊김", why: "방장과 연결이 끊겼어요" }; showResult();
  }
};
